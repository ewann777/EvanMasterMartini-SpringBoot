server:
  port: ${PORT:8090}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2500
            response-timeout: 8s
          default-filters:
            - RemoveRequestHeader=Origin
          routes:
            - id: identity
              uri: ${martini.identity-url}
              predicates:
                - Path=/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/logout,/api/v1/profile/me
            - id: catalog
              uri: ${martini.catalog-url}
              predicates:
                - Path=/api/v1/recipes/**,/api/v1/learning/**,/api/v1/admin/recipes/**,/api/v1/admin/learning/**
            - id: contact
              uri: ${martini.contact-url}
              predicates:
                - Path=/api/v1/contact,/api/v1/admin/contact,/api/v1/admin/contact/{number}
martini:
  identity-url: ${IDENTITY_URL:http://127.0.0.1:8081}
  catalog-url: ${CATALOG_URL:http://127.0.0.1:8082}
  contact-url: ${CONTACT_URL:http://127.0.0.1:8083}
management:
  endpoints:
    web:
      exposure:
        include: health

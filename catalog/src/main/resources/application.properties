spring.application.name=catalog
server.port=${PORT:8082}
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:martini_catalog}
spring.datasource.username=${DB_USER:martini_catalog}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=4000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog.sql
management.endpoints.web.exposure.include=health
server.error.include-message=never
